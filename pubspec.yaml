name: friends_co
description: FRIENDS & CO. wholesale management Flutter test app
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2
flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/app_icon.png
  adaptive_icon_background: "#101B30"
  adaptive_icon_foreground: assets/app_icon.png
